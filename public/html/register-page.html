<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/javascript/register-page.js" defer></script>
    <link rel=stylesheet href="/styles/register-page.css" >
    <title>Document</title>
    
</head>
<body>

    <header>
        Bienvenido a Q-Bussines
    </header>
    
    <div class="login-container">

        Cree una cuenta para acceder a Q-Bussines
        
        <input id="js-username-input" placeholder="username" type="text">

        <div class="registration-buttons">

            <button id="js-registration-button">Registrarme</button>

        </div>

    </div>
